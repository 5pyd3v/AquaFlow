name: aquaflow
description: "AquaFlow — Enterprise water bottle distribution platform. Customer, Vendor, Rider & Admin apps in one codebase."
publish_to: 'none'
version: 1.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

# ----------------------------------------------------------------------------
# Dependency policy for this project:
# Every package below is actually imported somewhere in lib/ — nothing is
# declared "just in case." Speculative packages for not-yet-built features
# (Stripe, PDF invoices, charts, etc.) are added in the same commit that
# starts using them, not ahead of time. This is deliberate: the single
# biggest source of `flutter pub get` version-solving failures in Flutter
# projects is code-generation tooling (build_runner + freezed +
# json_serializable + riverpod_generator + hive_generator + custom_lint +
# riverpod_lint) all pinning overlapping-but-different `analyzer` version
# ranges. None of that tooling is used in this build (models are
# hand-written — see README), so none of it is listed, and there is
# nothing here to conflict.
# ----------------------------------------------------------------------------

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management & routing
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2

  # Backend
  supabase_flutter: ^2.8.4

  # Push notifications (mobile only — guarded behind kIsWeb in main.dart,
  # see README "Running on Chrome / Web")
  firebase_core: ^3.10.1
  firebase_messaging: ^15.2.1
  flutter_local_notifications: ^18.0.1

  # Networking & connectivity
  dio: ^5.7.0
  connectivity_plus: ^6.1.3
  internet_connection_checker_plus: ^2.7.1

  # Maps & location
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Local storage / caching
  shared_preferences: ^2.3.4
  hive_flutter: ^1.1.0
  cached_network_image: ^3.4.1

  # UI / animation
  lottie: ^3.3.1
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.1

  # Media
  image_picker: ^1.1.2

  # Forms
  pin_code_fields: ^8.0.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  logger: ^2.5.0
  equatable: ^2.0.7
  collection: ^1.19.1
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.3
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
